<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BOCRA Compliance Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

body {
    margin: 0;
    background: #f8fafc;
    color: #1e293b;
}

.layout {
    display: flex;
    min-height: 100vh;
}

/* Sidebar */
.sidebar {
    width: 240px;
    background: #ffffff;
    border-right: 1px solid #e5e7eb;
    padding: 20px;
    display: flex;
    flex-direction: column;
}

.sidebar .brand {
    font-weight: 600;
    font-size: 18px;
    margin-bottom: 25px;
}

.sidebar nav a {
    display: block;
    padding: 10px;
    border-radius: 10px;
    color: #475569;
    text-decoration: none;
    margin-bottom: 5px;
}

.sidebar nav a:hover {
    background: #f1f5f9;
}

.sidebar nav a.active {
    background: #e0ecff;
    color: #2563eb;
}

.sidebar .logout {
    margin-top: auto; 
    padding-top: 20px; 
    border-top: 1px solid #e5e7eb;
}

/* Main */
main {
    flex: 1;
    padding: 20px;
}

/* Topbar */
.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff;
    padding: 15px 20px;
    border-radius: 14px;
    border: 1px solid #e5e7eb;
    margin-bottom: 20px;
}

.user {
    display: flex;
    align-items: center;
    gap: 10px;
}

.user img {
    width: 40px;
    border-radius: 50%;
}

/* Stats */
.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}

.stat-card {
    background: #fff;
    border-radius: 14px;
    border: 1px solid #e5e7eb;
    padding: 24px;
    text-align: center;
}

.stat-number {
    font-size: 36px;
    font-weight: 700;
    color: #1e293b;
    margin-bottom: 8px;
}

.stat-label {
    color: #64748b;
    font-size: 14px;
    font-weight: 500;
}

/* Tables */
.table-container {
    background: #fff;
    border-radius: 14px;
    border: 1px solid #e5e7eb;
    overflow: hidden;
    margin-bottom: 20px;
}

.table-header {
    padding: 20px;
    border-bottom: 1px solid #e5e7eb;
    font-weight: 600;
}

.data-table {
    width: 100%;
    border-collapse: collapse;
}

.data-table th {
    background: #f8fafc;
    padding: 15px 20px;
    text-align: left;
    font-weight: 600;
    color: #374151;
    border-bottom: 2px solid #e5e7eb;
}

.data-table td {
    padding: 15px 20px;
    border-bottom: 1px solid #f1f5f9;
}

.data-table tr:hover {
    background: #f8fafc;
}

.status-badge {
    padding: 4px 12px;
    border-radius: 9999px;
    font-size: 12px;
    font-weight: 500;
}

.status-pending {
    background: #fef3c7;
    color: #92400e;
}

.status-approved {
    background: #d1fae5;
    color: #065f46;
}

.status-expired {
    background: #fee2e2;
    color: #991b1b;
}

/* Tabs */
.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.tab {
    padding: 10px 20px;
    border-radius: 10px;
    background: #e5e7eb;
    cursor: pointer;
    font-weight: 500;
}

.tab.active {
    background: #2563eb;
    color: #fff;
}

.tabs-container {
    margin-bottom: 20px;
}

/* Form */
.application-form {
    background: #fff;
    padding: 20px;
    border-radius: 14px;
    border: 1px solid #e5e7eb;
}

.application-form input,
.application-form select,
.application-form textarea {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
}

.application-form button {
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 10px;
    cursor: pointer;
    margin-right: 10px;
}

.application-form button:hover {
    background: #1d4ed8;
}

/* Loading */
.loading {
    text-align: center;
    padding: 40px;
    color: #64748b;
}

.spinner {
    border: 4px solid #e5e7eb;
    border-top: 4px solid #2563eb;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
    margin: 0 auto 20px;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
</style>
</head>

<body>

<div class="layout">

<!-- Sidebar -->
<aside class="sidebar">
    <div class="brand">BOCRA Portal</div>

    <nav>
        <a href="clientDash.html">🏠 Home</a>
        <a href="licensing.html">📄 Licensing</a>
        <a class="active">📑 Compliance</a>
        <a>✅ Type Approval</a>
        <a>🌐 QoS Monitoring</a>
        <a>⚠️ Complaints</a>
        <a>📊 Reports</a>
        <a>💬 Support</a>
        <a>⚙️ Settings</a>
        <a>👤 Profile</a>
    </nav>

    <div class="logout">
        <a>🚪 Logout</a>
    </div>
</aside>

<!-- Main -->
<main>

<!-- Topbar -->
<div class="topbar">
    <div id="date"></div>
    <div class="user">
        <img src="https://i.pravatar.cc/40">
        <span>Aupa Moleofe</span>
    </div>
</div>

<!-- Stats -->
<div class="stats-grid" id="statsGrid">
    <div class="loading">
        <div class="spinner"></div>
        Loading compliance stats...
    </div>
</div>

<!-- Content Tabs -->
<div class="tabs-container">
    <div class="loading" id="loadingModules">Loading compliance modules...</div>
    <div class="tabs" id="dynamicTabs" style="display: none;"></div>
</div>

<!-- Submissions Table -->
<div class="table-container">
    <div class="table-header">
        <h3>Recent Submissions</h3>
        <div id="submissionsLoading" class="loading" style="display: none;">
            <div class="spinner"></div>Loading submissions...
        </div>
    </div>
    <div id="submissionsTable"></div>
</div>

<!-- Issued Licenses Table -->
<div class="table-container">
    <div class="table-header">
        <h3>Issued Licenses</h3>
        <div id="licensesLoading" class="loading" style="display: none;">
            <div class="spinner"></div>Loading licenses...
        </div>
    </div>
    <div id="licensesTable"></div>
</div>

</main>
</div>

<script>
// Compliance Dashboard System
(function() {
    'use strict';

    const dateEl = document.getElementById('date');
    const statsGrid = document.getElementById('statsGrid');
    const dynamicTabs = document.getElementById('dynamicTabs');
    const loadingModules = document.getElementById('loadingModules');
    const submissionsTable = document.getElementById('submissionsTable');
    const licensesTable = document.getElementById('licensesTable');

    // State
    let complianceModules = [];
    let submissions = [];
    let issuedLicenses = [];

    dateEl.textContent = new Date().toDateString();
    init();

    async function init() {
        await Promise.all([
            loadModules(),
            loadSubmissions(),
            loadIssuedLicenses()
        ]);
        loadStats();
    }

    async function loadModules() {
        try {
            loadingModules.innerHTML = '<div class="spinner"></div>Loading compliance modules...';
            const response = await fetch('https://bocra-api.skidotools.co.bw/api/v1/compliance/modules');
            complianceModules = await response.json();
            renderModules();
        } catch (error) {
            console.error('Failed to load modules:', error);
            loadingModules.textContent = 'Failed to load modules. Using demo data.';
            complianceModules = demoModules();
            renderModules();
        }
    }

    async function loadSubmissions() {
        try {
            submissionsTable.innerHTML = '<div class="loading"><div class="spinner"></div>Loading submissions...</div>';
            // Auth required - demo data
            submissions = demoSubmissions();
            renderSubmissions();
        } catch (error) {
            submissions = demoSubmissions();
            renderSubmissions();
        }
    }

    async function loadIssuedLicenses() {
        try {
            licensesTable.innerHTML = '<div class="loading"><div class="spinner"></div>Loading licenses...</div>';
            // Auth required - demo data
            issuedLicenses = demoLicenses();
            renderLicenses();
        } catch (error) {
            issuedLicenses = demoLicenses();
            renderLicenses();
        }
    }

    function demoModules() {
        return [
            {code: 'annual_return', name: 'Annual Return', description: 'Annual compliance return', payload_fields: []},
            {code: 'regulatory_report', name: 'Regulatory Report', description: 'Regulatory filing', payload_fields: []},
            {code: 'spectrum_usage_report', name: 'Spectrum Usage', description: 'Spectrum report', payload_fields: []},
            {code: 'quality_of_service_report', name: 'QoS Report', description: 'Quality of service', payload_fields: []}
        ];
    }

    function demoSubmissions() {
        return [
            {id: 'sub001', module: 'Annual Return', status: 'pending', date: '2024-01-15', licensee: 'ABC Corp'},
            {id: 'sub002', module: 'QoS Report', status: 'approved', date: '2024-01-10', licensee: 'XYZ Ltd'},
            {id: 'sub003', module: 'Spectrum Usage', status: 'pending', date: '2024-01-12', licensee: 'Telecom BW'}
        ];
    }

    function demoLicenses() {
        return [
            {id: 'lic001', licensee: 'ABC Corp', type: 'Network Services', expiry: '2024-12-31', status: 'active'},
            {id: 'lic002', licensee: 'XYZ Ltd', type: 'Application Services', expiry: '2024-06-30', status: 'expiring'},
            {id: 'lic003', licensee: 'Telecom BW', type: 'Frequency Assignment', expiry: '2025-03-15', status: 'active'}
        ];
    }

    function renderModules() {
        dynamicTabs.innerHTML = '';
        loadingModules.style.display = 'none';
        dynamicTabs.style.display = 'flex';

        complianceModules.forEach(module => {
            const tab = document.createElement('div');
            tab.className = 'tab';
            tab.dataset.module = module.code;
            tab.textContent = module.name;
            tab.title = module.description;
            dynamicTabs.appendChild(tab);
        });

        // Add click handlers
        dynamicTabs.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', handleModuleClick);
        });
    }

    function handleModuleClick(e) {
        const tabs = dynamicTabs.querySelectorAll('.tab');
        tabs.forEach(t => t.classList.remove('active'));
        e.currentTarget.classList.add('active');
        
        const moduleCode = e.currentTarget.dataset.module;
        const module = complianceModules.find(m => m.code === moduleCode);
        renderModuleForm(module);
    }

    function renderModuleForm(module) {
        const formHtml = `
            <div class="application-form">
                <h3>${module.name} Submission</h3>
                <p>${module.description}</p>
                
                <form id="complianceForm">
                    ${renderPayloadFields(module.payload_fields)}
                    
                    <div style="text-align: center; margin-top: 30px;">
                        <button type="submit" class="application-form button">Submit Compliance Report</button>
                    </div>
                </form>
            </div>
        `;
        
        document.querySelector('main').innerHTML = formHtml + document.querySelector('main').querySelector('.topbar').outerHTML;
        document.getElementById('complianceForm').addEventListener('submit', handleFormSubmit);
    }

    function renderPayloadFields(fields) {
        return fields.map(field => `
            <div class="form-field">
                <label>${field.label}${field.required ? ' <span style="color: #ef4444">*</span>' : ''}</label>
                <input type="${field.field_type === 'textarea' ? 'textarea' : 'text'}" name="${field.key}" placeholder="${field.description}" ${field.required ? 'required' : ''} style="width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px;">
            </div>
        `).join('');
    }

    function handleFormSubmit(e) {
        e.preventDefault();
        const formData = new FormData(e.target);
        console.log('Compliance submission:', Object.fromEntries(formData));
        alert('Compliance report submitted successfully!');
    }

    function renderSubmissions() {
        if (submissions.length === 0) {
            submissionsTable.innerHTML = '<div class="loading">No submissions found</div>';
            return;
        }
        
        let html = `
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Module</th>
                        <th>Licensee</th>
                        <th>Status</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
        `;
        
        submissions.forEach(sub => {
            const statusClass = sub.status === 'approved' ? 'status-approved' : 'status-pending';
            html += `
                <tr>
                    <td>${sub.id}</td>
                    <td>${sub.module}</td>
                    <td>${sub.licensee}</td>
                    <td><span class="status-badge ${statusClass}">${sub.status.toUpperCase()}</span></td>
                    <td>${sub.date}</td>
                    <td><button class="action-btn" onclick="viewSubmission('${sub.id}')">View</button></td>
                </tr>
            `;
        });
        
        html += '</tbody></table>';
        submissionsTable.innerHTML = html;
    }

    function renderLicenses() {
        if (issuedLicenses.length === 0) {
            licensesTable.innerHTML = '<div class="loading">No licenses found</div>';
            return;
        }
        
        let html = `
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Licensee</th>
                        <th>Type</th>
                        <th>Expiry</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
        `;
        
        issuedLicenses.forEach(license => {
            const statusClass = license.status === 'active' ? 'status-approved' : 'status-expired';
            html += `
                <tr>
                    <td>${license.id}</td>
                    <td>${license.licensee}</td>
                    <td>${license.type}</td>
                    <td>${license.expiry}</td>
                    <td><span class="status-badge ${statusClass}">${license.status.toUpperCase()}</span></td>
                </tr>
            `;
        });
        
        html += '</tbody></table>';
        licensesTable.innerHTML = html;
    }

    function loadStats() {
        statsGrid.innerHTML = `
            <div class="stat-card">
                <div class="stat-number">${complianceModules.length}</div>
                <div class="stat-label">Compliance Modules</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">${submissions.filter(s => s.status === 'pending').length}</div>
                <div class="stat-label">Pending Submissions</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">${issuedLicenses.length}</div>
                <div class="stat-label">Active Licenses</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">${submissions.length}</div>
                <div class="stat-label">Total Submissions</div>
            </div>
        `;
    }

    window.viewSubmission = (id) => {
        alert(`Viewing submission ${id} (mock - auth required for real data)`);
    };

})();
</script>

</body>
</html>
