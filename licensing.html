<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BOCRA Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { margin: 0; background: #f8fafc; color: #1e293b; }
.layout { display: flex; min-height: 100vh; }

/* Sidebar */
.sidebar {
    width: 240px;
    background: #ffffff;
    border-right: 1px solid #e5e7eb;
    padding: 20px;
    display: flex;
    flex-direction: column;
}
.sidebar .brand { font-weight: 600; font-size: 18px; margin-bottom: 25px; }
.sidebar nav a {
    display: block;
    padding: 10px;
    border-radius: 10px;
    color: #475569;
    text-decoration: none;
    margin-bottom: 5px;
}
.sidebar nav a:hover { background: #f1f5f9; }
.sidebar nav a.active { background: #e0ecff; color: #2563eb; }
aside .logout { margin-top:auto; padding-top:20px; border-top:1px solid #e5e7eb; }

/* Main */
main { flex: 1; padding: 20px; }

/* Topbar */
.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff;
    padding: 15px 20px;
    border-radius: 14px;
    border: 1px solid #e5e7eb;
    margin-bottom: 20px;
}
.user { display: flex; align-items: center; gap: 10px; }
.user img { width: 40px; border-radius: 50%; }

/* Tabs */
.tabs { display: flex; gap: 10px; margin-bottom: 20px; }
.tab { padding: 10px 20px; border-radius: 10px; background: #e5e7eb; cursor: pointer; font-weight: 500; }
.tab.active { background: #2563eb; color: #fff; }

/* Progress Bar */
.progress-bar { display: flex; margin-bottom: 30px; }
.progress-step { flex: 1; text-align: center; position: relative; }
.progress-step:not(:last-child)::after {
    content: '';
    position: absolute;
    top: 12px;
    left: 50%;
    width: 100%;
    height: 4px;
    background: #e5e7eb;
    z-index: -1;
}
.progress-step.active:not(:last-child)::after { background: #22c55e; }
.step-circle {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #e5e7eb;
    color: white;
    line-height: 28px;
    margin: 0 auto 5px;
    font-size: 13px;
}
.progress-step.active .step-circle { background: #22c55e; }
.step-label { font-size: 13px; color: #64748b; }
.progress-step.active .step-label { color: #22c55e; font-weight: 600; }

/* Form */
.application-form {
    background: #fff;
    padding: 20px;
    border-radius: 14px;
    border: 1px solid #e5e7eb;
}
.application-form input,
.application-form select,
.application-form textarea {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
}
.application-form button {
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 10px;
    cursor: pointer;
    margin-right: 10px;
}
</style>
</head>

<body>

<div class="layout">

<!-- Sidebar -->
<aside class="sidebar">
    <div class="brand">BOCRA Portal</div>
    <nav>
        <a href="clientDash.html">🏠 Home</a>
        <a class="active" href="licensing.html">📄 Licensing</a>
        <a href="compliance.html">📑 Compliance</a>
        <a>✅ Type Approval</a>
        <a>🌐 QoS Monitoring</a>
        <a>⚠️ Complaints</a>
        <a>📊 Reports</a>
        <a>💬 Support</a>
        <a>⚙️ Settings</a>
        <a>👤 Profile</a>
    </nav>
    <div class="logout">
        <a>🚪 Logout</a>
    </div>
</aside>

<!-- Main -->
<main>

<div class="topbar">
    <div id="date"></div>
    <div class="user">
        <img src="https://i.pravatar.cc/40">
        <span>Aupa Moleofe</span>
    </div>
</div>

<div class="tabs" id="tabs"></div>
<div class="progress-bar" id="progressBar"></div>
<div class="application-form" id="formContent"></div>

</main>
</div>

<script>
document.getElementById("date").textContent = new Date().toDateString();

const API_URL = "https://bocra-api.skidotools.co.bw/api/v1/licenses/application-types?active_only=true";

const tabMap = {
    new_application: "Apply",
    license_renewal: "Renewal",
    license_modification: "Modification",
    license_transfer: "Transfer",
    duplicate_license_request: "Duplicate"
};

let dataByTab = {};
let currentTab = null;
let currentStep = 0;
let selectedItem = null;

fetch(API_URL)
.then(r => r.json())
.then(res => {
    const list = Array.isArray(res) ? res : res.data || [];
    list.forEach(item => {
        if (!item.dynamic_form_schema || !item.dynamic_form_schema.sections) return;
        const tab = tabMap[item.service_type_code];
        if (!tab) return;
        if (!dataByTab[tab]) dataByTab[tab] = [];
        dataByTab[tab].push(item);
    });
    renderTabs();
});

function renderTabs() {
    const tabs = document.getElementById("tabs");
    tabs.innerHTML = "";
    Object.keys(dataByTab).forEach((tab, i) => {
        const el = document.createElement("div");
        el.className = "tab" + (i === 0 ? " active" : "");
        el.textContent = tab;
        el.onclick = () => switchTab(tab);
        tabs.appendChild(el);
        if (i === 0) currentTab = tab;
    });
    renderLicenseSelector();
}

function switchTab(tab) {
    currentTab = tab;
    currentStep = 0;
    selectedItem = null;
    document.querySelectorAll(".tab").forEach(t =>
        t.classList.toggle("active", t.textContent === tab)
    );
    renderLicenseSelector();
}

function renderLicenseSelector() {
    if (!dataByTab[currentTab]) return;
    document.getElementById("progressBar").innerHTML = "";
    document.getElementById("formContent").innerHTML = `
        <h3>Select License Type</h3>
        <select onchange="selectLicense(this.value)">
            <option value="">Select license</option>
            ${dataByTab[currentTab].map((i, idx) =>
                `<option value="${idx}">${i.name}</option>`
            ).join("")}
        </select>
    `;
}

function selectLicense(index) {
    selectedItem = dataByTab[currentTab][index];
    currentStep = 0;
    renderProgress();
    renderForm();
}

function renderProgress() {
    if (!selectedItem) return;
    const sections = selectedItem.dynamic_form_schema.sections || [];
    document.getElementById("progressBar").innerHTML =
        sections.map((s,i)=>`
            <div class="progress-step ${i<=currentStep?'active':''}">
                <div class="step-circle">${i+1}</div>
                <div class="step-label">${s.title}</div>
            </div>
        `).join("");
}

function renderForm() {
    if (!selectedItem) return;
    const step = selectedItem.dynamic_form_schema.sections[currentStep];
    if (!step) return;
    document.getElementById("formContent").innerHTML = `
        <h3>${step.title}</h3>
        ${step.fields.map(f => {
            if(f.type === "textarea") return `<textarea placeholder="${f.label}"></textarea>`;
            if(f.type === "select") return `<select><option disabled selected>${f.label}</option>${f.options.map(o=>`<option>${o}</option>`).join("")}</select>`;
            return `<input type="${f.type||'text'}" placeholder="${f.label}">`;
        }).join("")}
        ${currentStep>0?'<button onclick="prevStep()">Previous</button>':''}
        <button onclick="nextStep()">${currentStep === selectedItem.dynamic_form_schema.sections.length-1 ? 'Submit':'Next'}</button>
    `;
}

function nextStep() {
    if (!selectedItem) return;
    const sections = selectedItem.dynamic_form_schema.sections;
    if (currentStep < sections.length-1) {
        currentStep++;
        renderProgress();
        renderForm();
    } else {
        alert("Application submitted!");
        renderLicenseSelector();
    }
}

function prevStep() {
    if (!selectedItem || currentStep===0) return;
    currentStep--;
    renderProgress();
    renderForm();
}
</script>

</body>
</html>
