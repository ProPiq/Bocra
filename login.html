<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOCRA Two-Step Signup</title>
    <style>
        /* ⛔ UI NOT CHANGED */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            background: #e9e9e9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 1100px;
            height: 650px;
            background: #fff;
            border-radius: 20px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, .1);
        }

        .left {
            width: 50%;
            padding: 60px;
            display: flex;
            justify-content: center;
            align-items: stretch;
        }

        .auth-content {
            overflow-y: auto;
            max-height: 580px;
            padding-right: 10px;
            width: 100%;
        }

        .verify-only {
            display: none;
            text-align: center;
        }

        .otp-inputs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }

        .otp {
            width: 42px;
            height: 48px;
            font-size: 22px;
            text-align: center;
            border-radius: 6px;
            border: 1px solid #ddd;
        }


        h1 {
            font-size: 42px;
            font-weight: 300;
            color: gray;
        }

        .subtitle {
            color: gray;
            margin-bottom: 30px;
        }

        .input,
        select,
        textarea {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 16px;
        }

        .btn {
            margin-top: 25px;
            width: 150px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #1dbf73, #0f9d58);
            color: #fff;
            cursor: pointer;
            font-weight: bold;
        }

        .row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #666;
        }

        .bottom {
            margin-top: 40px;
            font-size: 14px;
            color: #777;
        }

        .bottom span {
            color: #1dbf73;
            cursor: pointer;
            text-decoration: underline;
        }

        .right {
            width: 50%;
            position: relative;
        }

        .bg-img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(40, 40, 40, .6);
        }

        .bocra {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .brand h1 {
            font-size: 64px;
            letter-spacing: 6px;
            color: #fff;
        }

        .dots {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
        }

        .blue {
            background: #007c91
        }

        .green {
            background: #2aa876
        }

        .pink {
            background: #c2185b
        }

        .yellow {
            background: #f4c20d
        }

        #orgSection {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f9f9f9;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="left">
            <div class="auth-content" id="authContent">
                <h1 id="title">Hello,<br>Welcome Back</h1>
                <p class="subtitle" id="subtitle">Hey, welcome back to your special place</p>

                <input class="input" id="fullName" placeholder="Full Name" style="display:none">
                <input class="input" id="email" placeholder="Email">
                <input class="input" id="phoneNumber" placeholder="Phone Number" style="display:none">
                <input class="input" id="password" type="password" placeholder="Password">
                <input class="input" id="confirmPassword" type="password" placeholder="Confirm Password"
                    style="display:none">

                <select class="input" id="userType" style="display:none">
                    <option value="individual" selected>Individual</option>
                    <option value="organization">Organization</option>
                </select>

                <!-- <input class="input" id="roleCode" placeholder="Role Code" style="display:none"> -->

                <div id="orgSection" style="display:none;">
                    <input class="input" id="orgName" placeholder="Organization Name">
                    <input class="input" id="regNumber" placeholder="Registration Number">
                    <select class="input" id="orgType">
                        <option value="company">Company</option>
                        <option value="trust">Trust</option>
                        <option value="association">Association</option>
                    </select>
                    <input class="input" id="taxId" placeholder="Tax Identifier">
                    <input class="input" id="orgEmail" placeholder="Contact Email">
                    <input class="input" id="orgPhone" placeholder="Contact Phone">
                    <textarea class="input" id="orgAddress" placeholder="Address"></textarea>
                </div>

                <div class="row" id="rowCheckbox">
                    <label><input type="checkbox" checked> Remember me</label>
                    <span>Forgot Password?</span>
                </div>

                <button class="btn" id="mainBtn">Sign In</button>

                <div class="bottom" id="bottomText">
                    Don't have an account? <span onclick="startSignUp()">Sign Up</span>
                </div>
            </div>

            <div class="verify-only" id="verifyOnly">
                <h1>Verify Email</h1>
                <p class="subtitle">
                    We've sent a verification code to your email address
                </p>

                <div class="otp-inputs">
                    <input class="otp" maxlength="1">
                    <input class="otp" maxlength="1">
                    <input class="otp" maxlength="1">
                    <input class="otp" maxlength="1">
                    <input class="otp" maxlength="1">
                    <input class="otp" maxlength="1">
                </div>

                <button class="btn" onclick="submitOtp()">Submit</button>

                <p style="margin-top:16px;font-size:14px;color:#777;">
                    Didn’t receive a code?
                    <span onclick="resendCode()" style="color:#1dbf73;cursor:pointer;text-decoration:underline;">
                        Resend code
                    </span>
                </p>
            </div>
        </div>

        <div class="right">
            <img src="img/slider-1.jpg" class="bg-img">
            <div class="overlay"></div>
            <div class="bocra">
                <div class="brand">
                    <h1>BOCRA</h1>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isSignUp = false;
        const $ = id => document.getElementById(id);

        function startSignUp() {
            isSignUp = true;
            $("title").innerHTML = "Create<br>Account";
            $("subtitle").innerText = "Complete registration";
            ["fullName", "phoneNumber", "confirmPassword", "userType"].forEach(id => $(id).style.display = "block");
            $("mainBtn").innerText = "Register";
            $("rowCheckbox").style.display = "none";
            $("bottomText").style.display = "none";

            // Add Sign In link
            if (!$("signInLink")) {
                const link = document.createElement("div");
                link.id = "signInLink";
                link.className = "bottom";
                link.innerHTML = `Already have an account? <span onclick="switchToLogin()" style="color:#1dbf73;cursor:pointer;text-decoration:underline;">Sign In</span>`;
                $("authContent").appendChild(link);
            }
        }

        function switchToLogin() {
            isSignUp = false;
            $("title").innerHTML = "Hello,<br>Welcome Back";
            $("subtitle").innerText = "Hey, welcome back to your special place";
            ["fullName", "phoneNumber", "confirmPassword", "userType"].forEach(id => $(id).style.display = "none");
            $("orgSection").style.display = "none";
            $("mainBtn").innerText = "Sign In";
            $("rowCheckbox").style.display = "flex";
            $("bottomText").style.display = "block";
            const link = $("signInLink");
            if (link) link.remove();
        }

        $("userType").onchange = () =>
            $("orgSection").style.display = $("userType").value === "organization" ? "block" : "none";

        $("mainBtn").onclick = async () => {
            const email = $("email").value.trim();
            const password = $("password").value;

            if (!email || !password) {
                return alert("Please enter email and password");
            }

            if (isSignUp) {
                // 🔹 Registration
                const payload = {
                    email: email,
                    phone_number: $("phoneNumber").value.replace(/\D/g, ""),
                    full_name: $("fullName").value.trim(),
                    password: password,
                    user_type: $("userType").value,
                    organization: null
                };

                if (payload.user_type === "organization") {
                    payload.organization = {
                        name: $("orgName").value.trim(),
                        registration_number: $("regNumber").value.trim(),
                        organization_type: $("orgType").value,
                        tax_identifier: $("taxId").value.trim(),
                        contact_email: $("orgEmail").value.trim(),
                        contact_phone: $("orgPhone").value.replace(/\D/g, ""),
                        address: $("orgAddress").value.trim()
                    };
                }

                try {
                    const res = await fetch("https://bocra-api.skidotools.co.bw/api/v1/auth/register", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Accept": "application/json"
                        },
                        body: JSON.stringify(payload)
                    });

                    const data = await res.json();
                    if (!res.ok) {
                        alert(data.message || "Registration failed");
                        console.error(data);
                        return;
                    }

                    $("authContent").style.display = "none";
                    $("verifyOnly").style.display = "block";

                } catch (e) {
                    console.error(e);
                    alert("Network error during registration");
                }

            } else {
                // 🔹 Login
                try {
                    const res = await fetch("https://bocra-api.skidotools.co.bw/api/v1/auth/login", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Accept": "application/json"
                        },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await res.json();
                    if (!res.ok) {
                        alert(data.message || "Login failed");
                        console.error(data);
                        return;
                    }

                    // Login success
                    localStorage.setItem("token", data.token || "dummy-token");
                    alert("Login successful!");
                    window.location.href = "clientDash.html";

                } catch (e) {
                    console.error(e);
                    alert("Network error during login");
                }
            }
        };

        function submitOtp() { alert("Verification complete"); }
        function resendCode() { alert("Code resent"); }
    </script>

</body>

</html>
